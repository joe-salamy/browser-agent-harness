services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: browser_agent_harness
      POSTGRES_USER: bah
      POSTGRES_PASSWORD: bah_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio_dev_password; do sleep 1; done;
      mc mb --ignore-existing local/workspace-files;
      "

volumes:
  postgres-data:
  minio-data:
